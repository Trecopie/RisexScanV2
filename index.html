<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/risex-icon.svg" />
    <title>RISExScan — RISEx Explorer & Perpetuals Analytics</title>
    <meta name="description" content="On-chain perpetuals explorer, smart-money leaderboard, ticker positioning analytics, and wallet profiler for RISEx on RISE Chain." />
    <meta property="og:title" content="RISExScan — RISEx Explorer & Perpetuals Analytics" />
    <meta property="og:description" content="On-chain perpetuals explorer, smart-money leaderboard, ticker positioning analytics, and wallet profiler for RISEx on RISE Chain." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('risexscan_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.dataset.theme = 'light';
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--tx)] antialiased selection:bg-[var(--sun)]/25 selection:text-[var(--sun)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
